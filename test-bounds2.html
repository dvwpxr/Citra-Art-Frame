<!DOCTYPE html>
<html>
<head>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
<script>
  const loader = new THREE.GLTFLoader();
  fetch('/frontend/assets/3d/frame.glb').then(res => res.arrayBuffer()).then(buffer => {
    loader.parse(buffer, '', (gltf) => {
      const sourceModel = gltf.scene;
      let debug = "";
      sourceModel.traverse((node) => {
        debug += node.name + " rot: " + 
                 node.rotation.x.toFixed(2) + ", " + 
                 node.rotation.y.toFixed(2) + ", " + 
                 node.rotation.z.toFixed(2) + "\n";
      });
      document.body.innerText = debug;
    });
  });
</script>
</body>
</html>
