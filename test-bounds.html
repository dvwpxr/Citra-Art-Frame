<!DOCTYPE html>
<html>
<head>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
<script>
  const loader = new THREE.GLTFLoader();
  fetch('frontend/assets/3d/frame.glb').then(res => res.arrayBuffer()).then(buffer => {
    loader.parse(buffer, '', (gltf) => {
      const sourceModel = gltf.scene;
      
      const sourceBox = new THREE.Box3().setFromObject(sourceModel);
      const sourceSize = new THREE.Vector3();
      sourceBox.getSize(sourceSize);
      
      console.log("sourceSize:", sourceSize.x, sourceSize.y, sourceSize.z);
      document.body.innerHTML += `<p>sourceSize: ${sourceSize.x}, ${sourceSize.y}, ${sourceSize.z}</p>`;
      
      function resetExporterPresentationRotation(model) {
        model?.traverse?.((node) => {
          if (!/sketchfab[_\s-]*model/i.test(String(node?.name || ""))) return;
          node.quaternion.identity();
          node.rotation.set(0, 0, 0);
          node.updateMatrix();
        });
        model?.updateMatrixWorld?.(true);
      }
      
      resetExporterPresentationRotation(sourceModel);
      const resetBox = new THREE.Box3().setFromObject(sourceModel);
      const resetSize = new THREE.Vector3();
      resetBox.getSize(resetSize);
      console.log("after reset:", resetSize.x, resetSize.y, resetSize.z);
      document.body.innerHTML += `<p>after reset: ${resetSize.x}, ${resetSize.y}, ${resetSize.z}</p>`;
    });
  });
</script>
</body>
</html>
