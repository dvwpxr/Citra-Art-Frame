<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - Citra Artframe</title>
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0c0c0f;
        --bg-soft: #111115;
        --panel: rgba(255, 255, 255, 0.03);
        --border: rgba(255, 255, 255, 0.08);
        --text: #f5f5f5;
        --muted: rgba(255, 255, 255, 0.52);
        --gold: #c09553;
        --gold-soft: rgba(192, 149, 83, 0.14);
        --danger: #f87171;
        --danger-soft: rgba(248, 113, 113, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Inter", sans-serif;
        background: 
          radial-gradient(circle at 50% 0%, rgba(192, 149, 83, 0.15), transparent 50%),
          linear-gradient(180deg, #111115 0%, #0c0c0f 100%);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .login-container {
        width: 100%;
        max-width: 420px;
        position: relative;
        animation: fadeUp 0.6s ease-out forwards;
      }

      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .login-shell {
        padding: 40px;
        border-radius: 24px;
        background: rgba(15, 15, 19, 0.7);
        border: 1px solid var(--border);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(20px);
      }

      .brand-header {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-bottom: 32px;
        color: var(--text);
        font-weight: 800;
        letter-spacing: 0.15em;
        font-size: 1rem;
      }

      .brand-header i {
        color: var(--gold);
        font-size: 1.5rem;
      }

      .login-head {
        text-align: center;
        margin-bottom: 32px;
      }

      .login-head h2 {
        margin: 0 0 8px;
        font-size: 1.6rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .login-head p {
        margin: 0;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .input-group {
        margin-bottom: 20px;
      }

      .input-group label {
        display: block;
        margin-bottom: 8px;
        font-size: 0.85rem;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.8);
      }

      .input-shell {
        position: relative;
      }

      .input-shell i {
        position: absolute;
        top: 50%;
        left: 16px;
        transform: translateY(-50%);
        color: rgba(255, 255, 255, 0.4);
        font-size: 1.1rem;
        transition: color 0.2s;
        pointer-events: none;
      }

      .input-shell input {
        width: 100%;
        height: 52px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        padding: 0 16px 0 48px;
        font: inherit;
        font-size: 0.95rem;
        transition: all 0.2s ease;
      }

      .input-shell input::placeholder {
        color: rgba(255, 255, 255, 0.3);
      }

      .input-shell input:focus {
        outline: none;
        border-color: var(--gold);
        background: rgba(255, 255, 255, 0.06);
        box-shadow: 0 0 0 4px rgba(192, 149, 83, 0.15);
      }

      .input-shell input:focus ~ i {
        color: var(--gold);
      }

      .error-message {
        min-height: 20px;
        margin: 0 0 16px;
        color: var(--danger);
        font-size: 0.85rem;
        text-align: center;
      }

      .error-message:not(:empty) {
        padding: 12px;
        border-radius: 10px;
        background: var(--danger-soft);
        border: 1px solid rgba(248, 113, 113, 0.2);
      }

      .submit-btn {
        width: 100%;
        height: 52px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #c09553 0%, #d4a762 100%);
        color: #111;
        font: inherit;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 0 8px 20px rgba(192, 149, 83, 0.25);
      }

      .submit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 24px rgba(192, 149, 83, 0.35);
        filter: brightness(1.05);
      }

      .submit-btn:active {
        transform: translateY(0);
      }

      .submit-btn:disabled {
        opacity: 0.7;
        cursor: not-allowed;
        transform: none;
      }

      @media (max-width: 480px) {
        .login-shell {
          padding: 30px 24px;
        }
      }
    </style>
  </head>
  <body>
    <main class="login-container">
      <div class="login-shell">
        <div class="brand-header">
          <i class="ri-camera-lens-line"></i>
          <span>CITRA ARTFRAME</span>
        </div>
        
        <div class="login-head">
          <h2>Admin Access</h2>
          <p>Please log in to manage your workspace.</p>
        </div>

        <form id="login-form" novalidate>
          <div class="input-group">
            <label for="username">Username</label>
            <div class="input-shell">
              <input
                id="username"
                name="username"
                type="text"
                autocomplete="username"
                placeholder="Enter username"
                required
              />
              <i class="ri-user-3-line"></i>
            </div>
          </div>

          <div class="input-group">
            <label for="password">Password</label>
            <div class="input-shell">
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="Enter password"
                required
              />
              <i class="ri-lock-2-line"></i>
            </div>
          </div>

          <div id="error-message" class="error-message"></div>

          <button type="submit" class="submit-btn" id="submit-btn">
            Sign In
          </button>
        </form>
      </div>
    </main>

    <script>
      document.getElementById("login-form").addEventListener("submit", function (e) {
        e.preventDefault();

        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        const errorMessageDiv = document.getElementById("error-message");
        const submitButton = document.getElementById("submit-btn");

        errorMessageDiv.textContent = "";
        submitButton.disabled = true;
        submitButton.textContent = "Signing in...";

        fetch("/api/admin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        })
          .then((response) => {
            if (!response.ok) {
              return response
                .json()
                .then((err) => {
                  throw new Error(err.message || "Username atau password salah.");
                })
                .catch(() => {
                  throw new Error("Login gagal. Username atau password salah.");
                });
            }

            window.location.href = "/dashboard";
          })
          .catch((error) => {
            errorMessageDiv.textContent = error.message;
          })
          .finally(() => {
            submitButton.disabled = false;
            submitButton.textContent = "Sign In";
          });
      });
    </script>
  </body>
</html>
