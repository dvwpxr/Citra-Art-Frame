<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout - Citra Artframe</title>
    <link rel="stylesheet" href="/assets/css/checkout.css?v=20260722-shipping-fallback1" />
    <link rel="stylesheet" href="/assets/css/device-responsive.css?v=20260727.1" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  </head>
  <body class="page-checkout">
    <main class="main-content">
      <div class="container">
        <h1 style="opacity: 0; animation: fadeInUp 0.5s ease-out forwards">Checkout</h1>
        <div class="checkout-grid">
          <!-- LEFT COLUMN -->
          <div class="checkout-left">
            <!-- 1. ALAMAT PENGIRIMAN -->
            <div class="checkout-card" id="addressSection">
              <h2>Alamat Pengiriman</h2>
              <div id="addressContent">
                <div class="skeleton"><div class="skeleton-text" style="width:80%"></div><div class="skeleton-text" style="width:60%"></div></div>
              </div>
            </div>

            <!-- 2. PRODUK DIPESAN -->
            <div class="checkout-card">
              <h2>Produk Dipesan</h2>
              <div id="summaryContainer">
                <div id="summarySkeleton" class="skeleton">
                  <div class="summary-item-preview">
                    <div class="skeleton-img"></div>
                    <div style="flex: 1"><div class="skeleton-text" style="width:80%"></div><div class="skeleton-text" style="width:60%"></div></div>
                  </div>
                </div>
                <div id="summaryContent" style="display: none"></div>
              </div>
            </div>

            <!-- 3. OPSI PENGIRIMAN -->
            <div class="checkout-card" id="shippingSection">
              <h2>Opsi Pengiriman</h2>
              <div id="shippingOptions">
                <p class="shipping-placeholder">Pilih alamat pengiriman untuk melihat opsi ongkir.</p>
              </div>
            </div>

            <!-- 4. METODE PEMBAYARAN -->
            <div class="checkout-card" id="paymentSection">
              <h2>Metode Pembayaran</h2>
              <div class="payment-method-grid" id="paymentMethodOptions">
                <label class="payment-method-option">
                  <input type="radio" name="payment_method" value="bca_va" />
                  <span>
                    <strong>BCA Virtual Account</strong>
                    <small>Transfer bank BCA</small>
                  </span>
                </label>
                <label class="payment-method-option">
                  <input type="radio" name="payment_method" value="mandiri_va" />
                  <span>
                    <strong>Mandiri Virtual Account</strong>
                    <small>Transfer bank Mandiri</small>
                  </span>
                </label>
                <label class="payment-method-option">
                  <input type="radio" name="payment_method" value="bni_va" />
                  <span>
                    <strong>BNI Virtual Account</strong>
                    <small>Transfer bank BNI</small>
                  </span>
                </label>
                <label class="payment-method-option">
                  <input type="radio" name="payment_method" value="bri_va" />
                  <span>
                    <strong>BRI Virtual Account</strong>
                    <small>Transfer bank BRI</small>
                  </span>
                </label>
                <label class="payment-method-option">
                  <input type="radio" name="payment_method" value="permata_va" />
                  <span>
                    <strong>Permata Virtual Account</strong>
                    <small>Transfer bank Permata</small>
                  </span>
                </label>
                <label class="payment-method-option">
                  <input type="radio" name="payment_method" value="cimb_va" />
                  <span>
                    <strong>CIMB Virtual Account</strong>
                    <small>Transfer bank CIMB Niaga</small>
                  </span>
                </label>
                <label class="payment-method-option">
                  <input type="radio" name="payment_method" value="qris" />
                  <span>
                    <strong>QRIS</strong>
                    <small>Scan QR dari aplikasi pembayaran</small>
                  </span>
                </label>
                <label class="payment-method-option">
                  <input type="radio" name="payment_method" value="ovo" />
                  <span>
                    <strong>OVO</strong>
                    <small>Pembayaran e-wallet OVO</small>
                  </span>
                </label>
              </div>
            </div>
          </div>

          <!-- RIGHT COLUMN -->
          <div class="checkout-right">
            <div class="checkout-card checkout-sticky">
              <h2>Ringkasan Pembayaran</h2>
              <div id="priceDetails">
                <div class="price-breakdown">
                  <div class="price-line"><span>Subtotal Produk</span><strong id="subtotalAmount">IDR 0</strong></div>
                  <div class="price-line"><span>Ongkos Kirim</span><strong id="shippingFee">IDR 0</strong></div>
                </div>
                <div class="price-total">
                  <span>Total Pembayaran</span>
                  <strong id="finalTotal">IDR 0</strong>
                </div>
              </div>
              <button id="payNowBtn" class="btn-pay" disabled>
                <span class="btn-text">Pilih Alamat & Ekspedisi</span>
                <div class="spinner" style="display: none"></div>
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- ADDRESS PICKER MODAL -->
    <div class="modal-overlay" id="addressPickerModal">
      <div class="modal-box">
        <h3>Pilih Alamat Pengiriman</h3>
        <div id="addressPickerList"></div>
        <div class="modal-actions">
          <button type="button" class="btn-outline" id="closeAddrPicker">Batal</button>
        </div>
      </div>
    </div>

    <script src="/assets/js/checkout.js?v=20260722-couriers1"></script>
  </body>
</html>
