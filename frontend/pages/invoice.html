<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoice - Citra Artframe</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-gold: #B88E5D;
      --text-main: #111827;
      --text-muted: #6b7280;
      --border-color: #e5e7eb;
      --bg-color: #ffffff;
      --bg-alt: #f9fafb;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      color: var(--text-main);
      background-color: var(--bg-alt);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .invoice-container {
      max-width: 800px;
      margin: 40px auto;
      background: var(--bg-color);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      padding: 40px;
      overflow: hidden;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 24px;
      margin-bottom: 32px;
    }
    .logo-area h1 {
      color: #000;
      margin: 0 0 8px;
      font-size: 24px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .logo-area p {
      margin: 0;
      color: var(--text-muted);
      font-size: 14px;
    }
    .invoice-title {
      text-align: right;
    }
    .invoice-title h2 {
      margin: 0 0 8px;
      font-size: 28px;
      color: var(--text-main);
    }
    .invoice-title p {
      margin: 0;
      font-size: 14px;
      color: var(--text-muted);
    }
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      margin-bottom: 40px;
    }
    .info-box h3 {
      font-size: 14px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 0 0 12px;
    }
    .info-box p {
      margin: 0 0 4px;
      font-size: 15px;
      line-height: 1.5;
    }
    .table-container {
      margin-bottom: 32px;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    th {
      background-color: var(--bg-alt);
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      border-bottom: 2px solid var(--border-color);
    }
    td {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      font-size: 15px;
      vertical-align: top;
    }
    .item-details span {
      display: block;
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .summary-box {
      width: 320px;
      margin-left: auto;
    }
    .summary-line {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      font-size: 15px;
      border-bottom: 1px solid var(--bg-alt);
    }
    .summary-line.total {
      font-weight: 700;
      font-size: 18px;
      color: var(--primary-gold);
      border-bottom: none;
      border-top: 2px solid var(--border-color);
      margin-top: 4px;
      padding-top: 16px;
    }
    .actions {
      margin-top: 40px;
      display: flex;
      gap: 16px;
      justify-content: flex-end;
    }
    .btn {
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      transition: all 0.2s;
      min-height: 44px;
    }
    .btn-print {
      background: var(--primary-gold);
      border: 1px solid var(--primary-gold);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-print:hover { background: #a07a4e; }
    .btn-back {
      background: #fff;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-back:hover { background: var(--bg-alt); border-color: #d1d5db; }

    .status-badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      margin-top: 8px;
    }
    .status-pending_payment,
    .status-awaiting_payment { background: #fef3c7; color: #d97706; }
    .status-payment_failed { background: #fee2e2; color: #dc2626; }
    .status-PENDING { background: #fef3c7; color: #d97706; }
    .status-PROCESSING { background: #dbeafe; color: #2563eb; }
    .status-SHIPPED { background: #e0e7ff; color: #4f46e5; }
    .status-DELIVERED { background: #dcfce3; color: #16a34a; }
    .status-CANCELED { background: #fee2e2; color: #dc2626; }

    @page {
      size: A4 portrait;
      margin: 12mm;
    }
    @media print {
      html, body { background: white; width: 100%; }
      body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .invoice-container { box-shadow: none; margin: 0; padding: 0; max-width: 100%; border-radius: 0; overflow: visible; }
      .actions { display: none; }
      .header, .info-grid, tr, .summary-box { break-inside: avoid; page-break-inside: avoid; }
      .table-container { overflow: visible; }
      table { min-width: 0 !important; }
    }
    @media screen and (max-width: 600px) {
      body {
        padding-top: max(18px, env(safe-area-inset-top));
        padding-bottom: max(16px, env(safe-area-inset-bottom));
      }
      .invoice-container {
        width: calc(100% - 24px) !important;
        margin: 0 auto !important;
        padding: 24px 18px !important;
        border-radius: 16px;
      }
      .header {
        flex-direction: column;
        gap: 16px;
        padding-bottom: 20px;
        margin-bottom: 24px;
      }
      .logo-area h1 { font-size: 20px; }
      .logo-area p { line-height: 1.5; }
      .invoice-title { text-align: left; }
      .invoice-title h2 { font-size: 24px; }
      .invoice-title p { line-height: 1.55; overflow-wrap: anywhere; }
      .info-grid {
        grid-template-columns: 1fr;
        gap: 14px;
        margin-bottom: 26px;
      }
      .info-box {
        padding: 16px;
        border: 1px solid var(--border-color);
        border-radius: 12px;
        background: #fcfcfb;
      }
      .info-box p { overflow-wrap: anywhere; }
      .table-container { overflow: visible; margin-bottom: 24px; }
      table, tbody { display: block; width: 100%; }
      thead { display: none; }
      tbody tr {
        display: block;
        padding: 16px;
        margin-bottom: 12px;
        border: 1px solid var(--border-color);
        border-radius: 12px;
        background: #fff;
      }
      tbody td {
        display: grid;
        grid-template-columns: 92px minmax(0, 1fr);
        gap: 10px;
        width: 100%;
        padding: 6px 0;
        border: 0;
        text-align: right !important;
        overflow-wrap: anywhere;
      }
      tbody td::before {
        content: attr(data-label);
        color: var(--text-muted);
        font-size: 13px;
        font-weight: 600;
        text-align: left;
      }
      tbody td.item-details {
        display: block;
        padding: 0 0 12px;
        margin-bottom: 6px;
        border-bottom: 1px solid var(--border-color);
        text-align: left !important;
      }
      tbody td.item-details::before { display: none; }
      tbody tr.invoice-empty-row td {
        display: block;
        padding: 6px 0;
        text-align: center !important;
      }
      tbody tr.invoice-empty-row td::before { display: none; }
      .summary-box { width: 100%; }
      .summary-line { gap: 16px; }
      .summary-line span:last-child { text-align: right; white-space: nowrap; }
      .summary-line.total { font-size: 16px; }
      .actions {
        width: 100%;
        margin-top: 28px;
        gap: 10px;
      }
      .actions .btn {
        width: 100%;
        max-width: 100%;
        min-height: 52px !important;
        padding: 0 16px;
        border-radius: 10px;
      }
    }
  </style>
  <link rel="stylesheet" href="/assets/css/device-responsive.css?v=20260727.1">
</head>
<body class="page-invoice">

  <div class="invoice-container" id="invoiceContent" style="display: none;">
    <div class="header">
      <div class="logo-area">
        <h1>CITRA ARTFRAME</h1>
        <p>Gallery & Custom Framing</p>
        <p>Jl. Karya Indah No. 12, Tangerang</p>
      </div>
      <div class="invoice-title">
        <h2>INVOICE</h2>
        <p id="invOrderUid">#ORDER-ID</p>
        <p id="invDate">Tanggal: -</p>
        <div id="invStatus" class="status-badge status-PENDING">PENDING</div>
      </div>
    </div>

    <div class="info-grid">
      <div class="info-box">
        <h3>Ditagihkan Kepada</h3>
        <p><strong id="invCustName">-</strong></p>
        <p id="invCustEmail">-</p>
        <p id="invCustPhone">-</p>
      </div>
      <div class="info-box">
        <h3>Informasi Pengiriman</h3>
        <p><strong id="invRecName">-</strong></p>
        <p id="invRecPhone">-</p>
        <p id="invFullAddress">-</p>
        <p style="margin-top: 8px; color: var(--text-muted); font-size: 13px;" id="invCourier">-</p>
      </div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Item</th>
            <th style="text-align:center;">Kuantitas</th>
            <th style="text-align:right;">Harga</th>
            <th style="text-align:right;">Total</th>
          </tr>
        </thead>
        <tbody id="invItems">
          <!-- Items injected here -->
        </tbody>
      </table>
    </div>

    <div class="summary-box">
      <div class="summary-line">
        <span>Subtotal</span>
        <span id="invSubtotal">Rp 0</span>
      </div>
      <div class="summary-line">
        <span>Ongkos Kirim</span>
        <span id="invShipping">Rp 0</span>
      </div>
      <div class="summary-line total">
        <span>Total Pembayaran</span>
        <span id="invTotal">Rp 0</span>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-print" id="downloadInvoicePdf" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
        Simpan Invoice PDF
      </button>
      <a href="/account" class="btn btn-back">Kembali ke Akun</a>
    </div>
  </div>

  <div id="loadingState" style="text-align: center; padding: 100px; color: var(--text-muted);">
    Memuat invoice...
  </div>

  <script src="/assets/js/invoice.js?v=20260722.2"></script>
</body>
</html>
